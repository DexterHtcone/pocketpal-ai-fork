name: Build Android APK

on:
  push:
    branches: [main, ru-translation-and-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Restore llama.rn native libraries
        run: |
          mkdir -p .tmp/llamarn-jni-backup
          curl -L -o /tmp/PocketChick.apk "https://github.com/Hmission/pocketpal-ai-fork/releases/download/v2.0.1/PocketChick-2.0.1-20260903.apk"
          unzip -q /tmp/PocketChick.apk "lib/*" -d /tmp/apk-libs
          cp -r /tmp/apk-libs/lib/* .tmp/llamarn-jni-backup/
          echo "=== Backup contents ==="
          ls -la .tmp/llamarn-jni-backup/arm64-v8a/ | head -20
          echo "=== llama files ==="
          ls .tmp/llamarn-jni-backup/arm64-v8a/librnllama* 2>/dev/null | wc -l

      - name: Install dependencies
        env:
          LLAMARN_JNI_BACKUP: ${{ github.workspace }}/.tmp/llamarn-jni-backup
        run: yarn install --frozen-lockfile

      - name: Remove restored jniLibs to avoid CMake duplicate
        run: |
          # CMake builds librnllama_jni.so; having a prebuilt copy in jniLibs
          # causes MergeNativeLibsTask to fail with DuplicateRelativeFileException.
          # Remove the restored copies so only the CMake output is used.
          rm -rf node_modules/llama.rn/android/src/main/jniLibs || true
          echo "Removed jniLibs to prevent duplicate native lib merge"

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pocketpal-ci-dummy",
              "storage_bucket": "pocketpal-ci-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyDummyCIKey"}],
                "services": {
                  "appinvite_service": {"other_platform_oauth_client": []}
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "Created dummy google-services.json"

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketChick-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn
